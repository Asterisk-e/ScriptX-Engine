/* Loads an installed OTA update if there is one; falls back to the built-in app.js if it fails to start. */
(function(){try{var o=JSON.parse(localStorage.getItem('scriptx.ota')||'null');if(o&&o.app){var s=document.createElement('style');s.textContent=o.css;document.head.appendChild(s);document.write('<script>'+o.app.replace(/<\/script/g,'<\\/script')+'<\/script>');setTimeout(function(){if(!window.__sxOK){localStorage.removeItem('scriptx.ota');location.reload()}},4000);return}}catch(e){}document.write('<script src="app.js"><\/script>')})();
</script>
